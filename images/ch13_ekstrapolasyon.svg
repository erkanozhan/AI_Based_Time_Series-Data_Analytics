<text x="450.0" y="50.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal">Trendli seride test dönemi değerleri eğitimde hiç görülmemiş bir düzeye çıkar; ağacın tahmini ise tavanda kalır</text>
