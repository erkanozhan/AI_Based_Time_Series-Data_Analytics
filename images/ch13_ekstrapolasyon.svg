<text x="450.0" y="410.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">Ağacın her yaprağı, eğitimde o yaprağa düşen hedef değerlerin ortalamasını verir; bu yüzden tahmin</text>
<text x="450.0" y="427.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">hiçbir zaman eğitimdeki en büyük değeri belirgin biçimde aşamaz.</text>
