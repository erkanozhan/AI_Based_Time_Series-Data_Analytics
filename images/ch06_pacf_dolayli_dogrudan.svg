<line x1="60" y1="385" x2="420" y2="385" stroke="#6b7280" stroke-width="1"/>
<rect x="79" y="275.0" width="22" height="110.0" fill="#2563eb"/>
<text x="90.0" y="269.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">0.5</text>
<text x="90.0" y="400.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">lag 1</text>
