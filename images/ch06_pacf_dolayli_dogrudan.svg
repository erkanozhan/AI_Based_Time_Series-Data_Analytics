<text x="160.0" y="324.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">0.25</text>
<text x="160.0" y="400.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">lag 2</text>
<rect x="219" y="357.5" width="22" height="27.5" fill="#2563eb"/>
<text x="230.0" y="351.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">0.125</text>
<text x="230.0" y="400.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">lag 3</text>
<rect x="289" y="371.2" width="22" height="13.8" fill="#2563eb"/>
<text x="300.0" y="365.2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">0.06</text>
<text x="300.0" y="400.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">lag 4</text>
<rect x="359" y="378.1" width="22" height="6.9" fill="#2563eb"/>
<text x="370.0" y="372.1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">0.03</text>
<text x="370.0" y="400.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">lag 5</text>
<text x="240.0" y="427.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">lag-2: 0.25 = 0.5 × 0.5 (tamamı zincirden gelir)</text>
<text x="660.0" y="238.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">PACF: doğrudan ilişki</text>
<rect x="480" y="255" width="360" height="150" fill="#f9fafb" stroke="#e5e7eb"/>
<line x1="480" y1="385" x2="840" y2="385" stroke="#6b7280" stroke-width="1"/>
<rect x="499" y="275.0" width="22" height="110.0" fill="#16a34a"/>
<text x="510.0" y="269.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">0.5</text>
<text x="510.0" y="400.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">lag 1</text>
<text x="580.0" y="379.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">0</text>
