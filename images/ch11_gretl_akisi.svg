<text x="794.0" y="224.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="middle" font-weight="normal">Tests → …</text>
<text x="794.0" y="242.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">Analysis → Forecasts</text>
<rect x="734.0" y="276" width="120" height="26" rx="6" fill="#1f2937"/>
<text x="794.0" y="293" font-family="Consolas, Menlo, monospace" font-size="12" fill="#f9fafb" text-anchor="middle">modtest, fcast</text>
<path d="M794.0,100 C794.0,80 622.0,80 622.0,98" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="708.0" y="80.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="normal" font-style="italic">artıklar uygun değilse modeli değiştir</text>
<text x="450.0" y="345.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">Menü adları sürüme göre küçük farklılık gösterebilir (eski sürümlerde ARIMA ve VAR, Model → Time series altındadır).</text>
<text x="450.0" y="367.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">Tüm adımlar komut penceresinde (Tools → Gretl console) ya da betik dosyasında (.inp) da çalıştırılabilir.</text>
