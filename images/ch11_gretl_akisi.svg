<text x="622.0" y="293" font-family="Consolas, Menlo, monospace" font-size="12" fill="#f9fafb" text-anchor="middle">arima, var</text>
<rect x="719.0" y="102" width="150" height="70" rx="10" fill="#dc2626" fill-opacity="0.10" stroke="#dc2626" stroke-width="1.6"/>
