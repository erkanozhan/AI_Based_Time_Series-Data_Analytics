<text x="508.0" y="165.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="start" font-weight="normal">Öz değerlerden biri birim</text>
<text x="508.0" y="180.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="start" font-weight="normal">çemberin dışında: şok büyür</text>
<text transform="rotate(-90 40 210)" x="40.0" y="210.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal">Enflasyonun tepkisi</text>
<text x="450.0" y="388.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">Okuma: çizgi sıfırın altındaysa faiz şoku enflasyonu düşürüyor; bant sıfırı içeriyorsa o dönemdeki etki istatistiksel olarak belirsiz.</text>
<text x="450.0" y="410.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Değerler kavramsaldır (gerçek veri değildir).</text>
