<text x="141.0" y="251.1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="bold">0.4</text>
<text x="229.0" y="345.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="bold">0.09</text>
<text x="135.0" y="294.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2563eb" text-anchor="middle" font-weight="bold">0.2</text>
<text x="229.0" y="311.4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#2563eb" text-anchor="start" font-weight="bold">0.126</text>
<text x="184.0" y="299.1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#7c3aed" text-anchor="start" font-weight="bold">0.18 (ikisi de)</text>
<line x1="360" y1="100" x2="384" y2="100" stroke="#dc2626" stroke-width="2.2"/>
<text x="390.0" y="104.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="normal">Faiz (şok bu değişkene)</text>
<line x1="360" y1="120" x2="384" y2="120" stroke="#2563eb" stroke-width="2.2"/>
<text x="390.0" y="124.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="normal">Enflasyon (çapraz etki)</text>
<rect x="590" y="80" width="290" height="280" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="735.0" y="104.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Hesap adımları</text>
<text x="735.0" y="124.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal">A₁ satırları: (0.5, 0.2) ve (0.1, 0.4)</text>
<text x="604.0" y="152.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="bold">h = 0</text>
<text x="652.0" y="152.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="normal">[0, 1]</text>
<text x="652.0" y="168.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">şok: faiz +1, enflasyon 0</text>
<text x="604.0" y="193.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="bold">h = 1</text>
<text x="652.0" y="193.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="normal">A₁ × [0, 1] = [0.2, 0.4]</text>
<text x="652.0" y="209.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">0.5·0 + 0.2·1 = 0.2 ;  0.1·0 + 0.4·1 = 0.4</text>
<text x="604.0" y="234.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="bold">h = 2</text>
<text x="652.0" y="234.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="normal">A₁ × [0.2, 0.4] = [0.18, 0.18]</text>
<text x="652.0" y="250.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">0.10 + 0.08 ;  0.02 + 0.16</text>
<text x="604.0" y="275.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="bold">h = 3</text>
<text x="652.0" y="275.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="normal">A₁ × [0.18, 0.18] = [0.126, 0.09]</text>
<text x="652.0" y="291.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">0.09 + 0.036 ;  0.018 + 0.072</text>
<text x="604.0" y="316.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="bold">h = 4</text>
<text x="652.0" y="316.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="start" font-weight="normal">A₁ × [0.126, 0.09] ≈ [0.081, 0.049]</text>
<text x="652.0" y="332.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal">[enflasyon, faiz] sırasıyla</text>
<text x="450.0" y="404.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Enflasyon önce yükselir (h = 1'de 0.2), sonra söner: en büyük öz değer 0.6 olduğu için tepki uzun vadede her adımda yaklaşık %60'ına iner.</text>
<text x="450.0" y="424.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Gerçek bir uygulamada aynı hesabı results.irf() yapar (Bölüm 10.9).</text>
</svg>