<title>Elle hesaplanan etki-tepki fonksiyonu</title>
<rect x="0.5" y="0.5" width="899" height="449" rx="10" fill="#ffffff" stroke="#d1d5db"/>
<text x="450.0" y="30.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold">Elle Hesaplanan Etki-Tepki: Faize 1 Birimlik Şok</text>
<text x="450.0" y="50.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal">Her adımda bir önceki tepki vektörü A₁ ile çarpılır: tepki(h) = A₁ × tepki(h − 1)</text>
