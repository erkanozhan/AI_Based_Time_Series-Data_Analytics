<text x="70.0" y="452.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">σ: sigmoid (0–1 arası vana)   ·   tanh: −1 ile 1 arasına sıkıştırma   ·   × : eleman eleman çarpım (⊙)   ·   + : toplama</text>
