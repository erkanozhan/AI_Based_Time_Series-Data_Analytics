<text x="450.0" y="50.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal">Üstteki bant uzun süreli hafızayı (hücre durumu) taşır; üç kapı bu banda neyin girip çıkacağını 0–1 arası oranlarla ayarlar</text>
