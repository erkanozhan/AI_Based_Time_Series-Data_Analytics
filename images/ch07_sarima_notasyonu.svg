<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
<title>SARIMA notasyonu</title>
<rect x="0.5" y="0.5" width="899" height="429" rx="10" fill="#ffffff" stroke="#d1d5db"/>
<text x="450.0" y="30.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold">SARIMA Notasyonu: ARIMA(p, d, q)(P, D, Q)[s]</text>
<text x="450.0" y="50.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal">Birinci parantez ardışık aylar arasındaki ilişkiyi, ikinci parantez mevsimden mevsime ilişkiyi tarif eder</text>
