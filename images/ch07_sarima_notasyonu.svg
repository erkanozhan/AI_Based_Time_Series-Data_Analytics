<line x1="446.0" y1="128" x2="330.0" y2="158" stroke="#ea580c" stroke-width="1.1" opacity="0.55"/>
<rect x="418" y="160" width="112" height="118" rx="10" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="1.6"/>
<text x="474.0" y="192.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#2563eb" text-anchor="middle" font-weight="bold">P</text>
<text x="474.0" y="216.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Mevsimsel AR</text>
<text x="474.0" y="238.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">Geçmiş mevsim değeri</text>
<text x="474.0" y="260.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="normal">xₜ₋ₛ, xₜ₋₂ₛ, …</text>
<line x1="506.0" y1="128" x2="474.0" y2="158" stroke="#2563eb" stroke-width="1.1" opacity="0.55"/>
<rect x="540" y="160" width="112" height="118" rx="10" fill="#16a34a" fill-opacity="0.08" stroke="#16a34a" stroke-width="1.6"/>
<text x="596.0" y="192.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#16a34a" text-anchor="middle" font-weight="bold">D</text>
<text x="596.0" y="216.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Mevsimsel fark</text>
<text x="596.0" y="238.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">Kaç mevsimsel fark?</text>
<text x="596.0" y="260.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="normal">(1 − Bˢ)ᴰ</text>
<line x1="556.0" y1="128" x2="596.0" y2="158" stroke="#16a34a" stroke-width="1.1" opacity="0.55"/>
