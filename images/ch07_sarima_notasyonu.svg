<text x="718.0" y="192.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#ea580c" text-anchor="middle" font-weight="bold">Q</text>
<text x="718.0" y="216.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Mevsimsel MA</text>
<text x="718.0" y="238.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">Geçmiş mevsim hatası</text>
<text x="718.0" y="260.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#ea580c" text-anchor="middle" font-weight="normal">εₜ₋ₛ, εₜ₋₂ₛ, …</text>
<line x1="606.0" y1="128" x2="718.0" y2="158" stroke="#ea580c" stroke-width="1.1" opacity="0.55"/>
<rect x="784" y="160" width="96" height="118" rx="10" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-width="1.6"/>
<text x="832.0" y="192.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#7c3aed" text-anchor="middle" font-weight="bold">s</text>
<text x="832.0" y="216.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Mevsim</text>
<text x="832.0" y="238.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">uzunluğu</text>
<text x="832.0" y="260.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="normal">aylık: 12</text>
<line x1="665.0" y1="128" x2="834.0" y2="158" stroke="#7c3aed" stroke-width="1.1" opacity="0.55"/>
<rect x="60" y="305" width="780" height="100" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="80.0" y="333.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2937" text-anchor="start" font-weight="bold">Örnek (AirPassengers):  ARIMA(0,1,1)(0,1,1)[12]</text>
<text x="80.0" y="357.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal">• d = 1, D = 1: bir normal fark (trend) ve bir 12 aylık fark (yıllık desen) alınır.</text>
<text x="80.0" y="377.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal">• q = 1, Q = 1: bir önceki ayın hatası ve geçen yılın aynı ayının hatası kullanılır.</text>
<text x="80.0" y="397.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="normal">• p = 0, P = 0: farkı alınmış seride ek bir AR terimine gerek görülmemiştir.</text>
</svg>
