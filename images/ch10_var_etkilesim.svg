<rect x="560" y="236" width="120" height="40" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
<text x="620.0" y="252.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">aynı A₁ matrisi</text>
<text x="620.0" y="268.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">her adımda tekrar</text>
<text x="450.0" y="428.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="normal">Mavi oklar: geçmiş enflasyonun etkisi (a₁₁, a₂₁)  ·  Turuncu oklar: geçmiş faizin etkisi (a₁₂, a₂₂)</text>
<text x="450.0" y="450.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal">Çapraz oklar (a₁₂, a₂₁) VAR'ı tek değişkenli AR modellerinden ayıran kısımdır.</text>
