<text x="44.0" y="104.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="start" font-weight="bold">Öz değerler: λ₁ = 0.6, λ₂ = 0.3  (|λ| &lt; 1)</text>
<text x="44.0" y="122.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="start" font-weight="bold">Kökler: z₁ = 1/0.6 ≈ 1.67, z₂ = 1/0.3 ≈ 3.33  (|z| &gt; 1)</text>
<text x="235.0" y="422.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">(a) Elle örnek: A₁ matrisi</text>
