<text x="450.0" y="50.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal">Stabilite koşulu iki taraftan okunabilir: |λ| &lt; 1 (öz değer çemberin içinde) ⇔ |z| = 1/|λ| &gt; 1 (kök çemberin dışında)</text>
