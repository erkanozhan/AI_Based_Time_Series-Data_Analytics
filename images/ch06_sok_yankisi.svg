<text x="450.0" y="50.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal">0. günde 100 birimlik tek bir şok; sonrasında hiç şok yok. Sol: şokun seriye etkisi. Orta ve sağ: teorik ACF ve PACF</text>
<text x="180.0" y="76.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Şokun etkisi (0, 1, 2, … gün sonra)</text>
