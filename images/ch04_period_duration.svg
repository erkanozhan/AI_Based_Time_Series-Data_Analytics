<text x="300.0" y="426.0" font-family="Consolas, Menlo, monospace, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="start" font-weight="normal">NA  (2025-02-29 yok!)</text>
<text x="600.0" y="426.0" font-family="Consolas, Menlo, monospace, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">"2025-02-28 06:00:00 UTC"</text>
<text x="40.0" y="460.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic">Period takvimi izler ("bir sonraki ayın aynı günü"); Duration saniye sayar. Ay sonu/artık yıl için %m+% kullanın.</text>
