<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
<title>Regresyon ağacı örneği</title>
<rect x="0.5" y="0.5" width="899" height="439" rx="10" fill="#ffffff" stroke="#d1d5db"/>
<text x="450.0" y="30.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold">Bir Regresyon Ağacı: Sorular, Dallar ve Yapraklar</text>
<text x="450.0" y="50.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal">AirPassengers eğitim verisi (Şub 1949 – Ara 1959, 131 ay) · tek özellik lag_1 (önceki ayın yolcu sayısı) · derinlik 2</text>
<line x1="450" y1="129" x2="250" y2="171" stroke="#9ca3af" stroke-width="1.6"/>
