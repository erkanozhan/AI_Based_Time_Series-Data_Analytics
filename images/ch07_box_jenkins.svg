<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
<title>Box-Jenkins döngüsü</title>
<rect x="0.5" y="0.5" width="899" height="469" rx="10" fill="#ffffff" stroke="#d1d5db"/>
<text x="450.0" y="30.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold">Box-Jenkins Yöntemi: Tanımlama → Tahmin → Teşhis → Öngörü</text>
<text x="450.0" y="50.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="normal">Teşhis aşaması başarısızsa model yeniden tanımlanır; döngü artıklar beyaz gürültü olana kadar sürer</text>
<rect x="40" y="105" width="170" height="118" rx="10" fill="#6b7280" fill-opacity="0.08" stroke="#6b7280" stroke-width="1.6"/>
<text x="125.0" y="135.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="bold">0. Hazırlık</text>
<text x="125.0" y="163.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.2" fill="#1f2937" text-anchor="middle" font-weight="normal">Seriyi çiz</text>
<text x="125.0" y="184.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.2" fill="#1f2937" text-anchor="middle" font-weight="normal">Log / Box-Cox dönüşümü</text>
<text x="125.0" y="205.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.2" fill="#1f2937" text-anchor="middle" font-weight="normal">ADF ve KPSS testleri</text>
<rect x="255" y="105" width="170" height="118" rx="10" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-width="1.6"/>
<text x="340.0" y="135.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">1. Tanımlama</text>
<text x="340.0" y="163.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.2" fill="#1f2937" text-anchor="middle" font-weight="normal">d ve D'yi seç (fark)</text>
<text x="340.0" y="184.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.2" fill="#1f2937" text-anchor="middle" font-weight="normal">ACF / PACF'ye bak</text>
<text x="340.0" y="205.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.2" fill="#1f2937" text-anchor="middle" font-weight="normal">p, q, P, Q adayları</text>
<rect x="470" y="105" width="170" height="118" rx="10" fill="#ea580c" fill-opacity="0.08" stroke="#ea580c" stroke-width="1.6"/>
<text x="555.0" y="135.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ea580c" text-anchor="middle" font-weight="bold">2. Tahmin</text>
<text x="555.0" y="163.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.2" fill="#1f2937" text-anchor="middle" font-weight="normal">Katsayıları kestir</text>
<text x="555.0" y="184.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.2" fill="#1f2937" text-anchor="middle" font-weight="normal">(en çok olabilirlik)</text>
<text x="555.0" y="205.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.2" fill="#1f2937" text-anchor="middle" font-weight="normal">AIC / BIC ile kıyasla</text>
<rect x="685" y="105" width="170" height="118" rx="10" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-width="1.6"/>
<text x="770.0" y="135.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="bold">3. Teşhis</text>
<text x="770.0" y="163.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.2" fill="#1f2937" text-anchor="middle" font-weight="normal">Artıkların ACF'si</text>
<text x="770.0" y="184.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.2" fill="#1f2937" text-anchor="middle" font-weight="normal">Ljung-Box testi</text>
<text x="770.0" y="205.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.2" fill="#1f2937" text-anchor="middle" font-weight="normal">Beyaz gürültü mü?</text>
<line x1="214.0" y1="164.0" x2="242.0" y2="164.0" stroke="#1f2937" stroke-width="1.8"/><polygon points="251.0,164.0 242.0,159.5 242.0,168.5" fill="#1f2937"/>
<line x1="429.0" y1="164.0" x2="457.0" y2="164.0" stroke="#1f2937" stroke-width="1.8"/><polygon points="466.0,164.0 457.0,159.5 457.0,168.5" fill="#1f2937"/>
<line x1="644.0" y1="164.0" x2="672.0" y2="164.0" stroke="#1f2937" stroke-width="1.8"/><polygon points="681.0,164.0 672.0,159.5 672.0,168.5" fill="#1f2937"/>
<line x1="770.0" y1="227.0" x2="770.0" y2="254.0" stroke="#1f2937" stroke-width="1.8"/><polygon points="770.0,263.0 774.5,254.0 765.5,254.0" fill="#1f2937"/>
<polygon points="770.0,265 848.0,305 770.0,345 692.0,305" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-width="1.6"/>
<text x="770.0" y="302.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">Artıklar</text>
<text x="770.0" y="320.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold">uygun mu?</text>
<polyline points="690.0,305 340.0,305 340.0,237" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4"/>
<polygon points="340.0,227 335.0,237 345.0,237" fill="#dc2626"/>
<text x="515.0" y="295.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="bold">Hayır: artıklarda yapı kaldı</text>
<text x="515.0" y="325.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="normal">→ farklı (p, d, q)(P, D, Q) dene</text>
<line x1="770.0" y1="347.0" x2="770.0" y2="370.0" stroke="#16a34a" stroke-width="1.8"/><polygon points="770.0,379.0 774.5,370.0 765.5,370.0" fill="#16a34a"/>
<text x="780.0" y="367.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#16a34a" text-anchor="start" font-weight="bold">Evet</text>
<rect x="520" y="381" width="330" height="64" rx="10" fill="#16a34a" fill-opacity="0.1" stroke="#16a34a" stroke-width="1.6"/>
<text x="685.0" y="407.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#16a34a" text-anchor="middle" font-weight="bold">4. Öngörü (forecast)</text>
<text x="685.0" y="429.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.2" fill="#1f2937" text-anchor="middle" font-weight="normal">Nokta tahmini + %80 / %95 tahmin aralıkları</text>
<line x1="770.0" y1="379" x2="770.0" y2="381" stroke="#16a34a"/>
<text x="60.0" y="420.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b7280" text-anchor="start" font-weight="bold">auto.arima() ve auto_arima(),</text>
<text x="60.0" y="440.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b7280" text-anchor="start" font-weight="normal">1. ve 2. adımları otomatikleştirir;</text>
<text x="60.0" y="460.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b7280" text-anchor="start" font-weight="normal">3. adımı yine siz yapmalısınız.</text>
</svg>
